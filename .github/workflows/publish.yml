name: Publish to npm

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Assert version bump vs public npm
        run: npm run assert:version

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Build production site for Lighthouse
        run: npm run build:prod

      - name: Run Lighthouse Audits
        run: npx @lhci/cli autorun

      - name: Upload test & E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            coverage/
            e2e-results/
            playwright-report/
            .lighthouseci/
          retention-days: 90

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, skipping release creation."
          else
            echo "Creating GitHub Release for $TAG_NAME..."
            gh release create "$TAG_NAME" --generate-notes --title "$TAG_NAME"
          fi

      - name: Publish package to npm
        run: npm publish --access public
